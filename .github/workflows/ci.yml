name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Run unit tests
      run: |
        dotnet test tests/MongoTui.Domain.Tests -c Release --no-build
        dotnet test tests/MongoTui.Application.Tests -c Release --no-build
        dotnet test tests/MongoTui.Infrastructure.Tests -c Release --no-build
        dotnet test tests/MongoTui.TUI.Tests -c Release --no-build
