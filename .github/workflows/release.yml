name: Release

on:
  push:
    tags: [ 'v*' ]

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: src/MongoTui.TUI/MongoTui.TUI.csproj

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact_name: mongotui-linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
            artifact_name: mongotui-linux-arm64
          - os: macos-latest
            rid: osx-x64
            artifact_name: mongotui-osx-x64
          - os: macos-latest
            rid: osx-arm64
            artifact_name: mongotui-osx-arm64
          - os: windows-latest
            rid: win-x64
            artifact_name: mongotui-windows-x64

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Publish self-contained
      shell: bash
      run: |
        version="${GITHUB_REF_NAME#v}"
        dotnet publish ${{ env.PROJECT_PATH }} \
          -c Release \
          -r ${{ matrix.rid }} \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:Version="$version" \
          -p:DebugType=none \
          -p:DebugSymbols=false \
          -o publish/${{ matrix.artifact_name }}
        find publish/${{ matrix.artifact_name }} -name '*.pdb' -delete

    - name: Bundle mongosh (Windows only)
      if: matrix.rid == 'win-x64'
      shell: bash
      run: |
        python - <<'PY'
        import hashlib
        import io
        import json
        import pathlib
        import urllib.request
        import zipfile

        with urllib.request.urlopen("https://downloads.mongodb.com/compass/mongosh.json", timeout=60) as response:
            manifest = json.load(response)

        latest = manifest["versions"][0]
        download = next(item for item in latest["downloads"] if item["distro"] == "win32" and item["arch"] == "x86_64")
        archive = download["archive"]
        with urllib.request.urlopen(archive["url"], timeout=300) as response:
            data = response.read()

        checksum = hashlib.sha256(data).hexdigest()
        if checksum != archive["sha256"]:
            raise SystemExit(f"mongosh checksum mismatch: {checksum}")

        target = pathlib.Path("publish/${{ matrix.artifact_name }}/thirdparty")
        target.mkdir(parents=True, exist_ok=True)
        with zipfile.ZipFile(io.BytesIO(data)) as bundle:
            for item in bundle.infolist():
                if not item.is_dir():
                    (target / pathlib.PurePosixPath(item.filename).name).write_bytes(bundle.read(item))
        print(f"Bundled mongosh {latest['version']} into {target}")
        PY

    - name: Package archive
      shell: bash
      run: |
        tar -czf ${{ matrix.artifact_name }}.tar.gz -C publish/${{ matrix.artifact_name }} .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_name }}.tar.gz

  create-release:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: '**/*.tar.gz'
        generate_release_notes: true
